<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up - RLS Tube</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <!-- Header -->
    <header class="topbar">

        <div class="logo">
            <a href="/">RLS Tube</a>
        </div>

        <nav>
            <a href="/">Home</a>
            <a href="/login">Login</a>
        </nav>

    </header>


    <!-- Signup Box -->
    <main class="auth-page">

        <div class="auth-box">

            <h1>Create Account</h1>

            <p class="auth-subtitle">
                Join RLS Tube today
            </p>


            <form method="POST" action="/signup">

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter username"
                        required>

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create password"
                        required>

                </div>


                <div class="form-group">

                    <label for="confirm_password">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirm_password"
                        name="confirm_password"
                        placeholder="Confirm password"
                        required>

                </div>


                <button type="submit" class="btn signup-btn">
                    Create Account
                </button>

            </form>


            <p class="auth-footer">
                Already have an account?
                <a href="/login">Login</a>
            </p>

        </div>

    </main>


    <!-- Footer -->
    <footer>
        <p>© 2026 RLS Tube. All Rights Reserved.</p>
    </footer>

</body>
</html>
