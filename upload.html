<!doctype html><html><head><meta charset="UTF-8"><title>Upload Video</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head>
<body><div class="upload-box"><h1>Upload Video</h1>
<form method="post" enctype="multipart/form-data">
<label>Video Title</label><input name="title" required>
<label>Description</label><textarea name="description" placeholder="Video description"></textarea>
<label>Video (MP4 / WEBM / MOV)</label><input type="file" name="video" accept="video/*" required>
<label>Thumbnail (optional)</label><input type="file" name="thumbnail" accept="image/*">
<button>Upload Video</button></form><a href="/">← Back Home</a></div></body></html>
